body {
  background: radial-gradient(circle, #0f0f0f, #000);

  display: flex;
  justify-content: center;

  font-family: "Garamond", "Georgia", serif;

.candle {
  position: absolute;
  width: 12px;
  height: 60px;
  background: #eee;
  border-radius: 5px;
  top: 50%;
}

.flame {
  position: absolute;
  top: -18px;
  left: 50%;
  width: 12px;
  height: 18px;
  background: orange;
  border-radius: 50%;
  transform: translateX(-50%);
  animation: flicker 0.2s infinite alternate;
}

@keyframes flicker {
  from { opacity: 0.7; transform: translateX(-50%) scale(1); }
  to { opacity: 1; transform: translateX(-50%) scale(1.1); }
}

  box-shadow: 0 0 40px rgba(255, 200, 120, 0.3);
  position: relative;
}
